{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
<form method="post" novalidate>{% csrf_token %}
  {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    {% if f.help_text %}<div class="form-text">{{ f.help_text|safe }}</div>{% endif %}</div>{% endfor %}
  <button class="btn btn-primary">Update password</button>
</form></div></div>
{% endblock %}
